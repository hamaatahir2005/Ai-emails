name: Signed Android release
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "HTTPS API URL ending in /"
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Decode signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BACKEND_URL: ${{ inputs.backend_url }}
        run: gradle -p android-app assembleRelease "-PBACKEND_URL=$BACKEND_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
